<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erenurkac</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;  /* Öğeleri alt alta sıralar */
            justify-content: flex-end; /* Dikeyde alta alır */
            align-items: center;     /* Yatayda ortalar */
            padding-bottom: 50px;    /* Alt kenardan boşluk */
            gap: 40px;               /* Kalp ile link arasındaki boşluk */
            background-color: hotpink; /* Arka plan rengini buraya taşıdık */
            font-family: sans-serif;
        }

        /* Gerçekçi CSS Kalp Çizimi */
        .heart {
            width: 50px;
            height: 50px;
            background-color: red;
            position: relative;
            transform: rotate(-45deg);
            /* Hafif bir gölge ile gerçekçilik (3D hissi) katalım */
            box-shadow: -10px 10px 20px rgba(139, 0, 0, 0.5); 
            animation: heartbeat 1.2s infinite; /* Atış animasyonu */
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            box-shadow: -10px -10px 20px rgba(139, 0, 0, 0.2);
        }

        .heart::before {
            top: -25px;
            left: 0;
        }

        .heart::after {
            left: 25px;
            top: 0;
        }

        /* Kalp Atışı (Büyüyüp Küçülme) Animasyonu */
        @keyframes heartbeat {
            0% { transform: rotate(-45deg) scale(1); }
            15% { transform: rotate(-45deg) scale(1.3); } /* İlk atış */
            30% { transform: rotate(-45deg) scale(1); }
            45% { transform: rotate(-45deg) scale(1.15); } /* İkinci küçük atış */
            100% { transform: rotate(-45deg) scale(1); }
        }

        /* Linki biraz büyüttük ve şıklaştırdık */
        a {
            font-size: 24px;         /* Yazı boyutu büyütüldü */
            font-weight: bold;
            color: white;            /* Hotpink arka planda okunaklı olması için */
            text-decoration: none;   /* Alt çizgiyi kaldırdık */
            background-color: rgba(255, 255, 255, 0.2); /* Hafif beyazımsı arka plan */
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background-color: rgba(255, 255, 255, 0.4); /* Üzerine gelince belirginleşir */
            transform: scale(1.05); /* Üzerine gelince link de hafif büyür */
        }
    </style>
</head>
<body>

    <!-- Atan Kalp -->
    <div class="heart"></div>

    <!-- Büyütülmüş Link -->
    <a href="asıl.html" target="_blank">Buraya Tıklayınız</a>

</body>
</html>
